name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # Developer Git hook installation is unnecessary for build and test jobs.
  npm_config_ignore_scripts: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run lint
  Test:
    name: Test (${{ matrix.os }}, ${{ matrix.node }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [16.x, 14.x, 12.x]
        include:
          - os: ubuntu-latest
            node: 22.x
          - os: ubuntu-latest
            node: 24.x
          - os: ubuntu-latest
            node: 26.x
            coverage: true
    # Keep the required check names while using Intel for legacy Node binaries.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf
      - uses: actions/checkout@v7
      # Build and type-check once with the modern compiler before testing old runtimes.
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:type
      - run: npm run test:build
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # AVA 4 runs the same compiled tests and public build on legacy Node versions.
      - run: npm install --no-save --package-lock=false --ignore-scripts ava@4.3.3
        if: matrix.node == '12.x' || matrix.node == '14.x' || matrix.node == '16.x'
      - run: npm run test:unit
        if: ${{ !matrix.coverage }}
      - run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text npm run test:unit
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
